<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador AR - Interface Limpa</title>
    <style>
        /* --- ESTILOS (CSS) --- */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            overscroll-behavior: none; 
            touch-action: none;
        }

        .workspace {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #ffffff;
        }

        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            display: none;
            pointer-events: none;
        }

        /* --- BOTÕES FLUTUANTES --- */
        .btn-flutuante {
            position: fixed;
            z-index: 1000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .btn-flutuante:active {
            transform: scale(0.9);
        }

        /* Posições dos botões */
        #btn-camera { top: 20px; left: 20px; font-size: 20px; }
        #btn-upload-label { top: 20px; right: 20px; }
        #btn-cadeado { bottom: 20px; right: 20px; }

        /* Esconde o input de arquivo original feio */
        #upload-imagem { display: none; }

        /* --- PAINEL DE OPACIDADE FLUTUANTE --- */
        #painel-opacidade {
            display: none; /* Escondido por padrão */
            position: fixed;
            bottom: 80px; /* Fica acima do cadeado */
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            text-align: center;
            border: 1px solid #ddd;
        }

        #painel-opacidade label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        /* --- CAIXA DA IMAGEM --- */
        #caixa-imagem {
            display: none;
            position: relative;
            cursor: grab;
            user-select: none;
            -webkit-user-drag: none;
            transform-origin: center center;
            border: 2px dashed #00c4cc;
            z-index: 1;
        }

        #caixa-imagem:active {
            cursor: grabbing;
        }

        .ponto {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: white;
            border: 2px solid #00c4cc;
            border-radius: 50%;
            pointer-events: none; 
        }

        .pt-tl { top: -9px; left: -9px; }    
        .pt-tr { top: -9px; right: -9px; }   
        .pt-bl { bottom: -9px; left: -9px; } 
        .pt-br { bottom: -9px; right: -9px; }

        #caixa-imagem.locked {
            border-color: transparent;
            cursor: not-allowed !important;
        }
        
        #caixa-imagem.locked .ponto {
            display: none;
        }

        #imagem-alvo {
            display: block;
            max-width: 80vw;
            max-height: 70vh;
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <div class="workspace" id="workspace">
        <video id="camera-feed" autoplay playsinline></video>

        <div id="btn-camera" class="btn-flutuante">📷</div>

        <label for="upload-imagem" id="btn-upload-label" class="btn-flutuante">☁️</label>
        <input type="file" id="upload-imagem" accept="image/*">

        <div id="btn-cadeado" class="btn-flutuante">🔓</div>

        <div id="painel-opacidade">
            <label for="slider-opacidade">Transparência</label>
            <input type="range" id="slider-opacidade" min="0" max="100" value="100">
        </div>

        <div id="caixa-imagem">
            <img id="imagem-alvo" src="" alt="Imagem carregada" draggable="false">
            <div class="ponto pt-tl"></div>
            <div class="ponto pt-tr"></div>
            <div class="ponto pt-bl"></div>
            <div class="ponto pt-br"></div>
        </div>
    </div>

    <script>
        const btnCamera = document.getElementById('btn-camera');
        const cameraFeed = document.getElementById('camera-feed');
        const uploadInput = document.getElementById('upload-imagem');
        const btnUploadLabel = document.getElementById('btn-upload-label');
        const sliderOpacidade = document.getElementById('slider-opacidade');
        const painelOpacidade = document.getElementById('painel-opacidade');
        const btnCadeado = document.getElementById('btn-cadeado');
        const caixaImagem = document.getElementById('caixa-imagem');
        const imagemAlvo = document.getElementById('imagem-alvo');
        const workspace = document.getElementById('workspace');

        let isLocked = false;
        let isDragging = false;
        let cameraStream = null; 
        
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let rotation = 0; 
        
        let startX = 0, startY = 0;
        let initialPinchDistance = 0, initialScale = 1;
        let initialAngle = 0, initialRotation = 0;
        
        // Variáveis para detectar se foi um "clique" rápido ou um "arrasto" na imagem
        let clickStartX = 0, clickStartY = 0;

        function atualizarTransformacao() {
            caixaImagem.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${rotation}deg)`;
        }

        // ==========================================
        // CÂMERA
        // ==========================================
        btnCamera.addEventListener('click', async function() {
            if (cameraStream) {
                const tracks = cameraStream.getTracks();
                tracks.forEach(track => track.stop());
                cameraStream = null;
                cameraFeed.style.display = 'none';
                workspace.style.backgroundColor = '#ffffff'; 
                btnCamera.innerHTML = '📷';
                btnCamera.style.backgroundColor = 'rgba(255, 255, 255, 0.85)';
            } else {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' }
                    });
                    cameraFeed.srcObject = cameraStream;
                    cameraFeed.style.display = 'block'; 
                    workspace.style.backgroundColor = '#000000'; 
                    btnCamera.innerHTML = '🚫';
                    btnCamera.style.backgroundColor = 'rgba(255, 200, 200, 0.9)';
                } catch (err) {
                    alert('Erro ao acessar a câmera. ' + err.message);
                }
            }
        });

        // ==========================================
        // UPLOAD & OPACIDADE
        // ==========================================
        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagemAlvo.src = event.target.result;
                    caixaImagem.style.display = 'inline-block';
                    
                    scale = 1; translateX = 0; translateY = 0; rotation = 0;
                    sliderOpacidade.value = 100; imagemAlvo.style.opacity = 1;
                    atualizarTransformacao();
                };
                reader.readAsDataURL(file);
            }
        });

        sliderOpacidade.addEventListener('input', function(e) {
            imagemAlvo.style.opacity = e.target.value / 100;
        });

        // Esconder opacidade ao clicar fora da imagem
        workspace.addEventListener('mousedown', function(e) {
            if (e.target === workspace || e.target === cameraFeed) {
                painelOpacidade.style.display = 'none';
            }
        });
        workspace.addEventListener('touchstart', function(e) {
            if (e.target === workspace || e.target === cameraFeed) {
                painelOpacidade.style.display = 'none';
            }
        });

        // ==========================================
        // CADEADO
        // ==========================================
        btnCadeado.addEventListener('click', function() {
            isLocked = !isLocked;
            
            if (isLocked) {
                btnCadeado.innerHTML = '🔒';
                caixaImagem.classList.add('locked');
                
                // Esconde a nuvem, a câmera e a opacidade
                btnUploadLabel.style.display = 'none';
                btnCamera.style.display = 'none';
                painelOpacidade.style.display = 'none';
            } else {
                btnCadeado.innerHTML = '🔓';
                caixaImagem.classList.remove('locked');
                
                // Volta a mostrar a nuvem e a câmera
                btnUploadLabel.style.display = 'flex';
                btnCamera.style.display = 'flex';
            }
        });

        // ==========================================
        // EVENTOS DE MOUSE (PC)
        // ==========================================
        caixaImagem.addEventListener('mousedown', function(e) {
            if (isLocked) return;
            e.preventDefault();
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            
            // Registra onde o clique começou para abrir a opacidade depois
            clickStartX = e.clientX;
            clickStartY = e.clientY;
        });

        window.addEventListener('mousemove', function(e) {
            if (!isDragging || isLocked) return;
            e.preventDefault();
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            atualizarTransformacao();
        });

        window.addEventListener('mouseup', function(e) {
            if (isDragging) {
                isDragging = false;
                
                // Calcula se o mouse moveu pouco (foi um clique) ou muito (foi um arrasto)
                const moveDist = Math.hypot(e.clientX - clickStartX, e.clientY - clickStartY);
                if (moveDist < 10 && !isLocked) {
                    // Abre o painel de opacidade
                    painelOpacidade.style.display = 'block';
                }
            }
        });

        workspace.addEventListener('wheel', function(e) {
            if (isLocked || caixaImagem.style.display === 'none') return;
            e.preventDefault();
            const zoomSpeed = 0.05;
            if (e.deltaY < 0) scale += zoomSpeed; else scale -= zoomSpeed;
            scale = Math.min(Math.max(0.1, scale), 5);
            atualizarTransformacao();
        }, { passive: false });

        // ==========================================
        // EVENTOS DE TOQUE (CELULAR)
        // ==========================================
        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        function getAngle(touches) {
            const dx = touches[1].clientX - touches[0].clientX;
            const dy = touches[1].clientY - touches[0].clientY;
            return Math.atan2(dy, dx) * (180 / Math.PI); 
        }

        caixaImagem.addEventListener('touchstart', function(e) {
            if (isLocked) return;
            
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                startY = e.touches[0].clientY - translateY;
                
                // Registra onde o toque começou
                clickStartX = e.touches[0].clientX;
                clickStartY = e.touches[0].clientY;
            } 
            else if (e.touches.length === 2) {
                isDragging = false; 
                initialPinchDistance = getPinchDistance(e.touches);
                initialScale = scale;
                initialAngle = getAngle(e.touches);
                initialRotation = rotation;
            }
        }, { passive: false });

        window.addEventListener('touchmove', function(e) {
            if (isLocked) return;
            if (e.touches.length === 1 && isDragging) {
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
                atualizarTransformacao();
            } 
            else if (e.touches.length === 2) {
                const currentPinchDistance = getPinchDistance(e.touches);
                const zoomFactor = currentPinchDistance / initialPinchDistance;
                scale = Math.min(Math.max(0.1, initialScale * zoomFactor), 5);

                const currentAngle = getAngle(e.touches);
                rotation = initialRotation + (currentAngle - initialAngle);
                atualizarTransformacao();
            }
        }, { passive: false });

        window.addEventListener('touchend', function(e) {
            if (e.touches.length === 0 && isDragging) {
                isDragging = false;
                
                // Como não há mais dedos, pegamos a coordenada do dedo que saiu
                const touch = e.changedTouches[0];
                const moveDist = Math.hypot(touch.clientX - clickStartX, touch.clientY - clickStartY);
                
                // Se moveu quase nada, significa que foi um "Tap" (toque rápido)
                if (moveDist < 10 && !isLocked) {
                    painelOpacidade.style.display = 'block';
                }
            } else if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                startY = e.touches[0].clientY - translateY;
            }
        });
    </script>
</body>
</html>
